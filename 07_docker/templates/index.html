<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telco Churn Predictor</title>
<style>
  :root { --azul:#1f3a5f; --gris:#f3f5f8; --borde:#d6dce5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--gris); color:#1c2430; }
  header { background: var(--azul); color:#fff; padding: 18px 32px; }
  header h1 { margin:0; font-size: 22px; }
  header p { margin:4px 0 0; opacity:.8; font-size:14px; }
  main { max-width: 760px; margin: 28px auto; padding: 0 16px; display:grid; gap:20px; }
  .card { background:#fff; border:1px solid var(--borde); border-radius:10px; padding:22px 24px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px 18px; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
  input, select { width:100%; padding:9px 10px; border:1px solid var(--borde); border-radius:6px; font-size:15px; }
  small { color:#66707d; font-size:12px; }
  button { margin-top:18px; background: var(--azul); color:#fff; border:0; border-radius:6px; padding:11px 22px; font-size:15px; cursor:pointer; }
  button:hover { filter: brightness(1.15); }
  #resultado { display:none; }
  .fila { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eef1f5; }
  .fila:last-child { border-bottom:0; }
  .badge { padding:3px 10px; border-radius:20px; font-weight:600; font-size:13px; }
  .riesgo { background:#fde2e1; color:#a1261f; } .ok { background:#dff3e4; color:#1d6b35; }
  .error { color:#a1261f; }
</style>
</head>
<body>
<header>
  <h1>Telco Churn Predictor</h1>
  <p>Predicción de abandono de clientes con el modelo Champion</p>
</header>
<main>
  <form class="card" id="form">
    <div class="grid">
      <div>
        <label for="tenure">Antigüedad del cliente (meses)</label>
        <input id="tenure" type="number" min="0" max="100" value="5" required>
      </div>
      <div>
        <label for="monthly">Cargo mensual ($)</label>
        <input id="monthly" type="number" min="0" step="0.01" value="85.5" required>
      </div>
      <div>
        <label for="total">Cargo total ($)</label>
        <input id="total" type="number" min="0" step="0.01" value="427.5" required>
        <small>Se calcula como meses × cargo mensual; puedes editarlo.</small>
      </div>
      <div>
        <label for="contract">Tipo de contrato</label>
        <select id="contract">
          <option>Month-to-month</option><option>One year</option><option>Two year</option>
        </select>
      </div>
      <div>
        <label for="internet">Servicio de internet</label>
        <select id="internet">
          <option>Fiber optic</option><option>DSL</option><option>No</option>
        </select>
      </div>
    </div>
    <button type="submit">Predecir</button>
  </form>

  <section class="card" id="resultado">
    <h2 style="margin-top:0;font-size:18px">Resultado</h2>
    <div id="filas"></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const recalcular = () => { $("total").value = (Number($("tenure").value) * Number($("monthly").value)).toFixed(2); };
  $("tenure").addEventListener("input", recalcular);
  $("monthly").addEventListener("input", recalcular);

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const cuerpo = {
      tenure: Number($("tenure").value),
      MonthlyCharges: Number($("monthly").value),
      TotalCharges: Number($("total").value),
      Contract: $("contract").value,
      InternetService: $("internet").value,
    };
    const r = await fetch("/predict", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) });
    const datos = await r.json();
    $("resultado").style.display = "block";
    if (!r.ok) {
      $("filas").innerHTML = `<p class="error">Error ${r.status}: datos inválidos.</p><pre>${JSON.stringify(datos, null, 2)}</pre>`;
      return;
    }
    const clase = datos.prediction === 1 ? "riesgo" : "ok";
    let html = `
      <div class="fila"><span>Predicción</span><span class="badge ${clase}">${datos.prediction === 1 ? "Abandona (1)" : "Permanece (0)"}</span></div>
      <div class="fila"><span>Probabilidad de abandono</span><strong>${(datos.churn_probability * 100).toFixed(1)} %</strong></div>
      <div class="fila"><span>Mensaje</span><span>${datos.message}</span></div>`;
    if (datos.risk_level) html += `<div class="fila"><span>Nivel de riesgo</span><strong>${datos.risk_level}</strong></div>`;
    $("filas").innerHTML = html;
  });
</script>
</body>
</html>
